<div class="auth-page">
  <div class="auth-language">
    <app-language-switcher />
  </div>

  <section class="auth-brand">
    <img src="/assets/logo.svg" alt="CultivaTech Logo" class="brand-logo" />
    <h1>{{ 'auth.brand.headline' | translate }}</h1>
    <p>{{ 'auth.brand.description' | translate }}</p>
  </section>

  <section class="auth-panel">
    <div class="auth-card">
      @if (errorMessage(); as errorKey) {
        <div class="alert alert-error" role="alert">
          {{ errorKey | translate }}
        </div>
      }
      @if (successMessage(); as okKey) {
        <div class="alert alert-success" role="status">
          {{ okKey | translate }}
        </div>
      }
      <app-sign-up-form
        [isSubmitting]="isSubmitting()"
        (submitForm)="onSignUp($event)"
        (navigateToSignIn)="onNavigateToSignIn()">
      </app-sign-up-form>
    </div>
  </section>
</div>
