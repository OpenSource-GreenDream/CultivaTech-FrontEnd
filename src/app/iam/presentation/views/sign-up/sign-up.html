<div class="page-layout">
  <header class="navbar">
    <div class="navbar-brand">
      <img src="/assets/logo.svg" alt="CultivaTech Logo" class="brand-logo" />
    </div>

    <nav class="navbar-nav">
      <button class="btn-solid" (click)="onNavigateToSignIn()">{{"sign-up.submit.click-3" | translate}}</button>
    </nav>
  </header>

  <main class="content-wrapper">
    <div class="auth-stack">
      @if (errorMessage(); as errorKey) {
        <div class="alert alert-error" role="alert">
          {{ errorKey | translate }}
        </div>
      }
      @if (successMessage(); as okKey) {
        <div class="alert alert-success" role="status">
          {{ okKey | translate }}
        </div>
      }
      <app-sign-up-form
        (submitForm)="onSignUp($event)"
        (navigateToSignIn)="onNavigateToSignIn()">
      </app-sign-up-form>
    </div>
  </main>
</div>
