<div class="profile-container">
  <div class="header-section">
    <h2 class="section-title">{{ "profile.management.title" | translate }}</h2>
    <p class="section-subtitle">{{ "profile.management.subtitle" | translate }}</p>
  </div>

  @if (isLoading) {
    <div class="loading-state">
      <p>{{ "profile.management.loading" | translate }}</p>
    </div>
  } @else {
    <div class="profile-grid">
      <app-profile-info [profile]="profileStore.currentProfile()"></app-profile-info>

      <app-field-list
        [fields]="profileStore.fields()"
        (fieldCreated)="onFieldCreated()">
      </app-field-list>
    </div>
  }
</div>
