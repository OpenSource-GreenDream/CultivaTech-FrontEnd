<div class="lang-pill-container" role="radiogroup">
  <button
    type="button"
    class="lang-pill-btn"
    [class.active]="currentLang === 'es'"
    (click)="setLanguage('es')"
    aria-label="ES">
    ES
  </button>
  <button
    type="button"
    class="lang-pill-btn"
    [class.active]="currentLang === 'en'"
    (click)="setLanguage('en')"
    aria-label="EN">
    EN
  </button>
</div>
