<div class="stock-movements-container">

  @if (successMessage) {
    <div class="success-message">
      <span>✓</span>
      {{ "stock.movement.success.registered" | translate }}
    </div>
  }

  <div class="movement-form-section">
    <app-stock-movement-form
      (submitForm)="onCreateMovement($event)">
    </app-stock-movement-form>
  </div>

  <div class="movement-list-section">
    <app-stock-movement-list
      [movements]="movements()">
    </app-stock-movement-list>
  </div>

</div>
